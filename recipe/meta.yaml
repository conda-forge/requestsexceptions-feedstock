{% set name = "requestsexceptions" %}
{% set version = "1.4.0" %}
{% set bundle = "tar.gz" %}
{% set hash = "b095cbc77618f066d459a02b137b020c37da9f46d9b057704019c9f77dba3065" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  fn: {{ name }}-{{ version }}.{{ bundle }}
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.{{ bundle }}
  sha256: {{ hash }}

build:
  noarch: python
  number: 1
  script: python setup.py install --single-version-externally-managed --record=record.txt


requirements:
  host:
    - python {{ python_min }}
    - setuptools
    - pbr >=2.0.0

  run:
    - python >={{ python_min }}

test:
  requires:
    - python {{ python_min }}
  imports:
    - requestsexceptions

about:
  home: https://github.com/openstack-infra/requestsexceptions
  license_file: {{ RECIPE_DIR }}/LICENSE
  license: Apache 2.0
  license_family: Apache
  summary: 'Import exceptions from potentially bundled packages in requests.'
  dev_url: https://github.com/openstack-infra/requestsexceptions

extra:
  recipe-maintainers:
    - pmlandwehr
